# RotPitch backend — runs on a single VPS (Hetzner Cloud recommended).
#
# Three services from one image:
#   redis  — BullMQ queue (replaces Upstash; data persisted to a named volume)
#   api    — Express API (port 4000)
#   worker — BullMQ render worker (FFmpeg; no HTTP)
#
# api + worker share ONE image (apps/api/Dockerfile, build context = repo root).
# Only `api` declares the build; `worker` reuses the built image and overrides
# the command. Bring it up with:
#
#   docker compose up -d --build
#
# Runtime env is read from .env (NOT baked into the image — see .dockerignore).
# REDIS_URL is overridden here to point at the in-compose `redis` service.
#
# Object storage (finished renders) is Cloudflare R2, S3-compatible. There is no
# instance-role concept off AWS, so set explicit credentials in .env:
#   S3_ENDPOINT=https://<account_id>.r2.cloudflarestorage.com
#   AWS_REGION=auto
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY = an R2 read+write API token key.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: rotpitch-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Point BullMQ at the in-compose Redis, regardless of .env's REDIS_URL.
      REDIS_URL: redis://redis:6379
      PORT: '4000'
    ports:
      # Bound to LOOPBACK only. Caddy (deploy/docker-compose.caddy.yml) reaches
      # the API as `api:4000` over the compose network, so the port never needs
      # to be public. Do NOT change this to '4000:4000': Docker writes its own
      # iptables DOCKER chain that BYPASSES ufw, so a published port is exposed
      # to the internet over plain HTTP even when the firewall says otherwise.
      # This binding still allows `curl localhost:4000/health` on the box.
      - '127.0.0.1:4000:4000'
    depends_on:
      redis:
        condition: service_healthy

  worker:
    # Reuse the image built by `api`; just change the command.
    image: rotpitch-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    command: ['pnpm', '--filter', '@rotpitch/api', 'start:worker']
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  redis-data:
